# Packaging metadata and tool config only. Dependencies are installed by
# environment.yml via mamba; this list records what the code imports.
# Install with: pip install -e . --no-deps
[project]
name = "composite-fea"
version = "0.1.0"
description = "Parametric large-deflection FEA of laminated composite parts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "gmsh>=4.12",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "matplotlib>=3.8",
    "seaborn>=0.13",
]

[project.scripts]
compfea-sweep = "compfea.sweep:main"
compfea-post = "compfea.post:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/compfea"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "slow: solves that take more than a few seconds (deselect with -m 'not slow')",
]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
